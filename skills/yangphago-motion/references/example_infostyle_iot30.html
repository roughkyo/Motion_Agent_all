<!doctype html>
<meta charset="utf-8">
<title>IoT 첫걸음 · 온습도 데이터 온라인 저장 (30s)</title>
<style>
  @font-face { font-family: KRD; src: url(fonts/KRD.ttf); }
  @font-face { font-family: KRS; src: url(fonts/KRS.ttf); }
  html, body { margin: 0; background: #070707; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; cursor: pointer; }
  #hint { position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); padding: 12px 26px;
          background: #B026FF; color: #070707; font: 700 20px sans-serif; border-radius: 999px; pointer-events: none; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">▶ 클릭: 재생/일시정지 · ←/→: 5초 이동</div>
<audio id="au" src="music/iot30.wav" preload="auto"></audio>
<script src="beatmap30.js"></script>
<script>
// ================= 기본 설정 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1920, H = 1080;
const BM = window.BEATMAP;
const BT = 60 / BM.bpm, BAR = BT * 4, DUR = BM.duration;
const BK = '#070707', WH = '#F4F4F0', PU = '#B026FF', PL = '#D9A3FF', GR = '#6E6E6E', DK = '#161616';
const D = '"KRD","Malgun Gothic",sans-serif';       // 헤드라인 (TmonMonsori Black)
const S = '"KRS","Malgun Gothic",sans-serif';       // 본문 (NanumSquare ExtraBold)
const MONO = '"Consolas","D2Coding",monospace';

// Pixabay 벡터 3컷 (tone_vectors.py로 보라 톤 재채색)
const IMG = {};
const imgReady = Promise.all([['laptop', 'computer-2023252'], ['server', 'cloud-2023901'], ['db', 'computer-1295318']].map(([k, f]) =>
  new Promise(r => { const im = new Image(); im.onload = r; im.onerror = r; im.src = `assets/${f}_duo.png`; IMG[k] = im; })));

// ================= 이징 · 유틸 =================
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const eoE = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const eoB = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eiC = x => { x = clamp(x); return x * x * x; };
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// 비트 반응: 마지막 킥/스네어 이후 경과시간으로 감쇠 곡선
function since(arr, t) { let last = -99; for (const x of arr) { if (x <= t + 1e-4) last = x; else break; } return t - last; }
function lastIdx(arr, t) { let k = -1; arr.forEach((x, i) => { if (x <= t + 1e-4) k = i; }); return k; }
const kickE = t => Math.exp(-since(BM.kicks, t) / 0.12);
const snE = t => Math.exp(-since(BM.snares, t) / 0.09);
const impE = t => Math.exp(-since(BM.impacts, t) / 0.25);

// ================= 그리기 도구 =================
function tw(s, size, face = D, ls = 0) {
  ctx.save(); ctx.font = `${size}px ${face}`; ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function T(s, x, y, size, col, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0 || !s) return;
  ctx.save();
  ctx.font = `${size}px ${o.face || D}`;
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha *= a;
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  const sc = o.sc ?? 1;
  ctx.scale(sc * (o.sx ?? 1), sc * (o.sy ?? 1));
  if (o.reveal !== undefined) {                     // 마스크 안에서 아래→위로 올라오는 글자
    const r = clamp(o.reveal);
    if (r <= 0) { ctx.restore(); return; }
    const w = ctx.measureText(s).width;
    const ax = o.align === 'left' ? 0 : o.align === 'right' ? -w : -w / 2;
    ctx.beginPath(); ctx.rect(ax - 30, -size * .66, w + 60, size * 1.32); ctx.clip();
    ctx.translate(0, (1 - eoE(r)) * size * 1.25);
  }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  if (o.stroke) { ctx.lineWidth = o.lw || 4; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.strokeText(s, 0, 0); }
  else { ctx.fillStyle = col; ctx.fillText(s, 0, 0); }
  ctx.restore();
}
// 쾅! 하고 박히는 글자 (f: 등장 후 경과 박자)
function slam(s, x, y, size, col, f, o = {}) {
  if (f < 0) return;
  const k = lerp(o.from ?? 2.2, 1, eoE(f / (o.d ?? .22)));
  T(s, x, y, size, col, { ...o, sc: (o.sc ?? 1) * k, alpha: (o.alpha ?? 1) * clamp(f / .04) });
}
// 타자 치듯 나타나는 글자 (가운데 정렬이어도 글자가 흔들리지 않도록 왼쪽 기준으로 그림)
function typeT(s, x, y, size, col, p, o = {}) {
  if (p <= 0) return;
  const ch = Array.from(s), n = Math.floor(clamp(p) * ch.length), sub = ch.slice(0, n).join('');
  const face = o.face || D, full = tw(s, size, face, o.ls || 0);
  const x0 = o.align === 'center' ? x - full / 2 : o.align === 'right' ? x - full : x;
  T(sub, x0, y, size, col, { ...o, align: 'left' });
  if (o.cursor && p < 1.6 && (p < 1 || Math.floor(p * 6) % 2 === 0)) {
    R(x0 + tw(sub, size, face, o.ls || 0) + 4, y - size * .45, size * .5, size * .9, o.cc || PU, { alpha: o.alpha ?? 1 });
  }
}
function R(x, y, w, h, col, o = {}) {
  if ((o.alpha ?? 1) <= 0) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.beginPath();
  if (o.r) ctx.roundRect(x, y, w, h, o.r); else ctx.rect(x, y, w, h);
  if (o.lw) { ctx.lineWidth = o.lw; ctx.strokeStyle = col; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
  else { ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
function C(x, y, r, col, o = {}) {
  if ((o.alpha ?? 1) <= 0 || r <= 0) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.beginPath(); ctx.arc(x, y, r, o.a0 ?? 0, o.a1 ?? Math.PI * 2);
  if (o.lw) { ctx.lineWidth = o.lw; ctx.strokeStyle = col; ctx.lineCap = o.cap || 'round'; ctx.stroke(); }
  else { ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
function P(cx, cy, r, n, rot, col, o = {}) {       // 정다각형
  if ((o.alpha ?? 1) <= 0) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * 2 * Math.PI / n - Math.PI / 2;
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
  }
  ctx.closePath();
  if (o.lw) { ctx.lineWidth = o.lw; ctx.lineJoin = 'miter'; ctx.strokeStyle = col; ctx.stroke(); }
  else { ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
// 꺾은선을 p(0~1)만큼만 그림 → 선이 그려져 나가는 효과
function L(pts, col, lw, p = 1, o = {}) {
  if (p <= 0 || (o.alpha ?? 1) <= 0) return null;
  let tot = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let rem = clamp(p) * tot, end = pts[0];
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 20; }
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = o.cap || 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const k = Math.min(1, rem / seg[i - 1]);
    end = [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)];
    ctx.lineTo(...end); rem -= seg[i - 1];
  }
  ctx.stroke(); ctx.restore();
  return end;
}
function pill(s, x, y, size, bg, fg, o = {}) {      // 알약 모양 태그
  const w = tw(s, size, o.face || S, o.ls || 0) + size * 1.2, h = size * 1.7;
  const sc = o.sc ?? 1;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1; ctx.translate(x, y); ctx.scale(sc, sc);
  const ax = o.align === 'center' ? -w / 2 : o.align === 'right' ? -w : 0;
  R(ax, -h / 2, w, h, bg, { r: h / 2 });
  if (o.outline) R(ax, -h / 2, w, h, fg, { r: h / 2, lw: 3 });
  T(s, ax + w / 2, 2, size, fg, { face: o.face || S, ls: o.ls || 0 });
  ctx.restore();
  return w;
}
function group(o, fn) {                             // 이동·크기·투명도를 묶어서 적용
  if ((o.alpha ?? 1) <= 0) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(o.x || 0, o.y || 0);
  if (o.cx !== undefined) { ctx.translate(o.cx, o.cy); if (o.rot) ctx.rotate(o.rot); ctx.scale(o.sc ?? 1, o.sy ?? o.sc ?? 1); ctx.translate(-o.cx, -o.cy); }
  fn(); ctx.restore();
}
function rings(cx, cy, f, col = PU, maxR = 1000) {  // 충격파 링
  for (let k = 0; k < 3; k++) {
    const g = (f - k * .14) / 1.3;
    if (g <= 0 || g >= 1) continue;
    C(cx, cy, maxR * eoE(g), col, { lw: 18 * (1 - g), alpha: 1 - g });
  }
}
function burst(cx, cy, f, seed, n = 26, maxR = 900) {   // 도형 파편이 사방으로 튐
  if (f < 0) return;
  for (let i = 0; i < n; i++) {
    const a = rnd(seed + i) * Math.PI * 2, sp = .35 + .65 * rnd(seed + i + 40);
    const r = maxR * sp * eoE(f / 1.6) + f * 20;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * .75;
    const sz = 14 + 34 * rnd(seed + i + 80), rot = f * (rnd(seed + i + 9) - .5) * 4, col = i % 3 ? PU : WH;
    const al = clamp(1.2 - f / 6);
    if (i % 3 === 0) P(x, y, sz, 3, rot, col, { lw: 4, alpha: al });
    else if (i % 3 === 1) P(x, y, sz, 4, rot, col, { lw: 4, alpha: al });
    else C(x, y, sz * .7, col, { lw: 4, alpha: al });
  }
}
function img(k, x, y, w, o = {}) {                  // 벡터 이미지 (가로폭 기준, 가운데 정렬)
  const im = IMG[k];
  if (!im || !im.naturalWidth || (o.alpha ?? 1) <= 0) return null;
  const h = w * im.naturalHeight / im.naturalWidth;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
  ctx.restore();
  return { x0: x - w / 2, y0: y - h / 2, w, h };
}

// ================= 소품 =================
function drawDHT(x, y, s, p = 1, o = {}) {
  // DHT11 모듈: 구멍 뚫린 몸통 + 핀 3개
  const w = 170 * s, h = 220 * s;
  R(x - w / 2, y - h / 2, w, h, DK, { alpha: clamp(p * 2 - .6) });
  L([[x - w / 2, y - h / 2], [x + w / 2, y - h / 2], [x + w / 2, y + h / 2], [x - w / 2, y + h / 2], [x - w / 2, y - h / 2]], WH, 5, p * 1.4);
  for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) {
    const i = r * 4 + c, q = clamp((p - .3 - i * .02) * 5), lit = o.lit ? o.lit(i) : 0;
    R(x - w / 2 + 22 * s + c * 34 * s, y - h / 2 + 22 * s + r * 36 * s, 24 * s * q, 24 * s * q, lit ? PU : '#3a3a3a', { glow: lit ? PU : 0 });
  }
  [0, 1, 2].forEach(i => L([[x + (i - 1) * 46 * s, y + h / 2], [x + (i - 1) * 46 * s, y + h / 2 + 60 * s]], i === 0 ? PU : WH, 7 * s, clamp((p - .7) * 4)));
}
function drawBoard(x, y, s, p = 1, t = 0) {
  // UNO R4 WiFi: 보드 + 와이파이 전파
  const w = 300 * s, h = 210 * s, q = clamp(p * 3);
  ctx.save(); ctx.globalAlpha *= q;
  R(x - w / 2, y - h / 2, w, h, DK, { r: 16 * s }); R(x - w / 2, y - h / 2, w, h, WH, { r: 16 * s, lw: 5 });
  R(x - 50 * s, y - 30 * s, 110 * s, 80 * s, '#2b2b2b', { r: 6 });
  for (let i = 0; i < 9; i++) R(x - w / 2 + 26 * s + i * 28 * s, y - h / 2 + 14 * s, 14 * s, 14 * s, GR);
  T('UNO R4 WiFi', x, y + 75 * s, 26 * s, WH, { face: S });
  for (let k = 0; k < 3; k++) {
    const a = clamp(Math.sin(t * 6 - k) * .5 + .5);
    C(x + w / 2 - 30 * s, y - h / 2 - 10 * s, (20 + k * 22) * s, PU, { lw: 6 * s, a0: -Math.PI * .8, a1: -Math.PI * .2, alpha: .4 + .6 * a });
  }
  ctx.restore();
}
function key(x, y, s, col, rot = 0) {               // 열쇠 아이콘
  group({ cx: x, cy: y, sc: s, rot }, () => {
    C(x - 40, y, 28, col, { lw: 12 });
    L([[x - 12, y], [x + 70, y]], col, 12, 1, { cap: 'butt' });
    L([[x + 50, y], [x + 50, y + 24]], col, 12, 1, { cap: 'butt' });
    L([[x + 68, y], [x + 68, y + 18]], col, 12, 1, { cap: 'butt' });
  });
}
// 구글 시트 표: 활동지의 제목 행 그대로
function sheet(x, y, w, rows, o = {}) {
  const cols = [.5, .25, .25], hh = 58, rh = 54;
  const cxOf = j => x + w * (cols.slice(0, j).reduce((a, b) => a + b, 0) + cols[j] / 2);
  R(x, y, w, hh, PU, { r: 8 });
  ['서버 수신 시각(KST)', '온도(℃)', '습도(%)'].forEach((s, j) => T(s, cxOf(j), y + hh / 2 + 2, 26, BK, { face: S }));
  rows.forEach((r, i) => {
    const ry = y + hh + i * rh, a = r.a ?? 1, hot = i === rows.length - 1 && o.hot;
    R(x, ry, w, rh, hot ? '#1f0d2e' : '#101010', { alpha: a });
    R(x, ry, w, rh, '#2c2c2c', { lw: 2, alpha: a });
    r.v.forEach((s, j) => T(s, cxOf(j), ry + rh / 2 + 1, 26, hot ? WH : GR, { face: MONO, alpha: a }));
  });
}
function check(x, y, s, p, col = PU) {              // ✓ 체크 표시 (그려지는 효과)
  L([[x - 30 * s, y], [x - 8 * s, y + 24 * s], [x + 34 * s, y - 26 * s]], col, 12 * s, p, { glow: col });
}
function cross(x, y, s, p, col = PU) {              // ✕ 표시
  L([[x - 28 * s, y - 28 * s], [x + 28 * s, y + 28 * s]], col, 13 * s, p * 2, { glow: col });
  L([[x + 28 * s, y - 28 * s], [x - 28 * s, y + 28 * s]], col, 13 * s, p * 2 - 1, { glow: col });
}
function panel(x, y, w, h, title) {                 // 어두운 창 (시리얼 모니터 등)
  R(x, y, w, h, '#0e0e0e', { r: 16 }); R(x, y, w, h, '#333', { r: 16, lw: 2 });
  [0, 1, 2].forEach(i => C(x + 32 + i * 28, y + 32, 8, i === 0 ? PU : '#444'));
  T(title, x + 130, y + 33, 24, GR, { face: S, align: 'left' });
}

// ================= 장면 (단위: 박) =================
// [시작 박, 끝 박, HUD 라벨, 그리기 함수]
const SC = [
  [0, 4, '00 HOOK', sHook],
  [4, 10, '01 역할 분담', sRelay],
  [10, 16, '02 열쇠 3개', sKeys],
  [16, 22, '03 웹 앱 시험', sWeb],
  [22, 28, '04 1단계 · 직접 입력', sStep1],
  [28, 34, '05 2단계 · 자동 기록', sStep2],
  [34, 38, '06 주의 3', sWarn],
  [38, 99, '', sOutro],
];

// ---------- 00 훅: 센서값이 / 구글 시트로 / 날아간다 ----------
function sHook(b, t) {
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-.32);
  R(-1400, -90, 2800 * eoE(b / .35), 180, PU, { alpha: .14 });
  ctx.restore();
  pill('[IoT 첫걸음] 온습도 데이터 온라인 저장', 140, 140, 30, BK, PL, { outline: 1, sc: eoB((b - .3) / .4) });
  const kp = 1 + .03 * kickE(t);
  slam('센서값이', 140, 330, 190, WH, b, { align: 'left', sc: kp });
  slam('구글 시트로', 140, 560, 190, PU, b - 1, { align: 'left', glow: PU, gb: 30, sc: kp });
  // 날아간다: 오른쪽으로 쏠리며 잔상
  if (b > 2) {
    const f = b - 2, dx = f > 1.3 ? eiC((f - 1.3) / .7) * 1600 : 0;
    for (let k = 3; k >= 1; k--) if (dx > 0) T('날아간다', 140 + dx - k * 90, 790, 190, PU, { align: 'left', alpha: .18 * (4 - k) / 3 });
    slam('날아간다', 140 + dx, 790, 190, WH, f, { align: 'left', sc: kp });
    for (let i = 0; i < 6; i++) {                     // 스피드 라인
      const y = 720 + i * 26, x0 = 1000 + rnd(i) * 300;
      L([[x0 + dx * .5, y], [x0 + 300 + dx, y]], i % 2 ? WH : PU, 4, clamp(f / .3), { alpha: .7 });
    }
  }
  // 오른쪽: 센서 → 패킷 발사
  drawDHT(1600, 360, 1.05, clamp(b / .6), { lit: i => (Math.floor(b * 4) + i) % 6 === 0 });
  if (b > 2) {
    const q = clamp((b - 2) / 1.6);
    const x = lerp(1600, 2100, eiC(q)), y = lerp(560, 300, q);
    R(x - 46, y - 22, 92, 44, PU, { r: 8, glow: PU });
    T('26·61', x, y + 1, 22, BK, { face: MONO });
  }
}

// ---------- 01 역할 분담: 4단계 릴레이 ----------
const NODES = [[260, 'DHT11', '온습도 측정'], [720, 'UNO R4 WiFi', 'Wi-Fi로 전송'], [1180, 'Apps Script', '받아서 검사'], [1640, 'Google Sheet', '한 줄 기록']];
function sRelay(b, t) {
  slam('역할 분담', 140, 150, 96, WH, b, { align: 'left' });
  T('4단계 릴레이', 600, 156, 40, PU, { face: S, align: 'left', reveal: (b - .3) / .4 });
  const y = 480;
  NODES.forEach(([x, name, role], i) => {
    const f = b - .5 - i * .5;
    if (i > 0) L([[NODES[i - 1][0] + 130, y], [x - 130, y]], GR, 4, (f + .3) / .4, { dash: [14, 12] });
    if (f < 0) return;
    group({ cx: x, cy: y, sc: eoB(f / .35) }, () => {
      C(x, y, 140, DK); C(x, y, 140, i === 3 ? PU : '#3a3a3a', { lw: 4, glow: i === 3 ? PU : 0 });
      if (i === 0) drawDHT(x, y - 14, .62, 1, { lit: c => (Math.floor(t * 8) + c) % 7 === 0 });
      if (i === 1) drawBoard(x, y + 6, .62, 1, t);
      if (i === 2) img('server', x, y, 150);
      if (i === 3) img('db', x, y, 150, { glow: PU, gb: 30 });
    });
    T(name, x, y + 200, 44, WH, { reveal: f / .3 });
    T(`${i + 1}. ${role}`, x, y + 252, 32, i === 3 ? PU : GR, { face: S, reveal: (f - .1) / .3 });
  });
  // 패킷: 반 박마다 출발 → 시트 도착
  for (let k = 0; k < 6; k++) {
    const q = (b - 2.5 - k * .5) / 1.6;

const WIPES = { 4: 2, 10: 0, 16: 1, 22: 2, 28: 0, 34: 1 };    // 장면 시작 박 → 전환 종류
function wipe(t) {
  for (const [beat, kind] of Object.entries(WIPES)) {
    const p = (t - beat * BT) / .34 + .5;
    if (p <= 0 || p >= 1) continue;
    const a = p < .5 ? eio(p * 2) : 1 - eio((p - .5) * 2);
    if (kind === 0) {                                // 보라 커튼
      if (p < .5) R(0, 0, W * a, H, PU); else R(W * (1 - a), 0, W * a, H, PU);
    } else if (kind === 1) {                         // 셔터 8칸
      for (let i = 0; i < 8; i++) R(i * W / 8, 0, W / 8 + 1, H * clamp(a * 1.4 - i * .05), i % 2 ? WH : PU);
    } else {                                         // 사선 슬래시
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-.35);
      R(-1400, -800, 2800, 1600 * a, PU); R(-1400, 800 - 800 * a, 2800, 800 * a, BK);
      ctx.restore();
    }
  }
}
function glitch(seed, amt) {
  for (let i = 0; i < 9; i++) {
    const y = rnd(seed + i) * H, h = 8 + rnd(seed + i + 9) * 90, dx = (rnd(seed + i + 20) - .5) * amt * 2;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
}
const grains = [], dots = document.createElement('canvas'), vig = document.createElement('canvas');

    gx.putImageData(im, 0, 0); grains.push(g);

// ================= 메인 렌더 =================
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BK; ctx.fillRect(0, 0, W, H);
  const bt = t / BT;
  const sc = SC.find(s => bt < s[1]) || SC[SC.length - 1];
  const lb = bt - sc[0];
  ctx.globalAlpha = .07 + .08 * kickE(t); ctx.drawImage(dots, 0, 0); ctx.globalAlpha = 1;
  // 카메라: 스네어 흔들림 + 킥 줌 + 임팩트 강타
  const si = lastIdx(BM.snares, t), shake = 7 * snE(t) + 28 * impE(t);
  const zx = (rnd(si * 3.1) - .5) * shake, zy = (rnd(si * 7.7) - .5) * shake, z = 1 + .012 * kickE(t) + .04 * impE(t);
  ctx.save();
  ctx.translate(W / 2 + zx, H / 2 + zy); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  sc[3](lb, t);
  ctx.restore();
  wipe(t);
  // 플래시: 시작 드롭 + 임팩트
  let fl = .85 * Math.exp(-t / .12);
  for (const x of BM.impacts) if (t >= x) fl = Math.max(fl, Math.exp(-(t - x) / .16));
  if (fl > .01) { ctx.fillStyle = WH; ctx.globalAlpha = fl; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // 글리치 · 엔딩 스트로브
  const sinceSn = since(BM.snares, t), outro = t >= BM.impacts[0];
  if (sinceSn < .1 && (outro || (bt >= 34 && bt < 38))) glitch(si * 13, 40 * (1 - sinceSn / .1));
  if (impE(t) > .2) glitch(lastIdx(BM.impacts, t) * 31 + Math.floor(t * 30), 90 * impE(t));
  if (outro && t < BM.impacts[1] && sinceSn < .05) {
    ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = WH; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  }
  ctx.drawImage(vig, 0, 0);
  ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grains[Math.floor(t * 30) % 6], 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  hud(t, sc[2], clamp((t - .3) / .4) * (1 - clamp((t - BM.gap[0]) / .2)));
}

fetch(au.src).then(r => r.blob()).then(b => { au.src = URL.createObjectURL(b); }).catch(() => {});
cv.onclick = () => { if (au.paused) { au.play(); hint.style.display = 'none'; } else au.pause(); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') au.currentTime = Math.min(DUR, au.currentTime + 5);
  if (e.key === 'ArrowLeft') au.currentTime = Math.max(0, au.currentTime - 5);
  if (e.key === ' ') cv.onclick();
});
(function loop() { if (!au.paused) render(au.currentTime); requestAnimationFrame(loop); })();
</script>
