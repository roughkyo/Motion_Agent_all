<script>
// ================= 기본 설정 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1920, H = 1080;
const BM = window.BEATMAP;
const BT = 60 / BM.bpm, DUR = BM.duration;
BM.kicks = BM.kicks || []; BM.snares = BM.snares || []; BM.impacts = BM.impacts || [];
// 색감: storyboard.json palette {bg 배경, main 주(글자), accent 강조, sub 보조} — 없으면 블랙·화이트·퍼플
const PAL = window.PALETTE || {};
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => `rgba(${hexRGB(h).join(',')},${a})`;
const mix = (a, b, k) => '#' + hexRGB(a).map((c, i) => Math.round(c + (hexRGB(b)[i] - c) * k).toString(16).padStart(2, '0')).join('');
const BK = PAL.bg || '#070707', WH = PAL.main || '#F4F4F0', PU = PAL.accent || '#B026FF', PL = PAL.sub || '#D9A3FF';
const GR = mix(BK, WH, .45);
// 글꼴: D=티몬몬소리 Black · S=나눔스퀘어 ExtraBold · P5~P9=페이퍼로지 · M=고정폭(코드)
const FACE = { D: 'KRD', S: 'KRS', P5: 'PL5', P6: 'PL6', P7: 'PL7', P8: 'PL8', P9: 'PL9' };
for (const k in FACE) FACE[k] = `"${FACE[k]}","Malgun Gothic",sans-serif`;
const MONO = '"Consolas","D2Coding","Malgun Gothic",monospace';
FACE.M = MONO;
const D = FACE[window.FONT_TITLE] || FACE.D;        // 제목용 (storyboard.json fonts.title)
const S = FACE[window.FONT_BODY] || FACE.S;         // 본문용 (storyboard.json fonts.body)
const faceOf = k => !k ? null : k === 'S' ? S : k === 'T' ? D : (FACE[k] || null);
const TITLE = window.TITLE || '';
const OUTRO_TOP = window.OUTRO_TOP ?? 'made by';
const OUTRO_WORD = window.OUTRO_WORD || 'yangphago';
const OUTRO_SUB = window.OUTRO_SUB ?? TITLE;
// 효과 스위치 (storyboard.json fx) — 기본은 레퍼런스(IoT 30초) 측정값
const FX = Object.assign({ dots: true, grain: true, vignette: true, hud: true, flash: true, glitch: true, shake: 1,
                           zoom: 1, punch: 0, wipe: true, strobe: true }, window.FX || {});

// 엔딩 타이밍: gap(2박 정적) → 임팩트 → 마지막 한 방
const OS = window.NO_OUTRO ? Infinity : BM.gap ? BM.gap[0] : DUR - 10 * BT;
const IMP = BM.impacts.find(x => x >= OS - .01) ?? OS + 2 * BT;
const FIN = BM.impacts.length ? BM.impacts[BM.impacts.length - 1] : IMP + 4 * BT;

// 이미지 (storyboard.json assets: {"laptop": "assets/laptop_duo.png"}) — tone_vectors.py로 재채색한 PNG 권장
const IMG = {};
const imgReady = Promise.all(Object.entries(window.ASSETS || {}).map(([k, f]) =>
  new Promise(r => { const im = new Image(); im.onload = r; im.onerror = r; im.src = f; IMG[k] = im; })));

// ================= 이징 · 유틸 =================
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const eoE = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const eoB = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eiC = x => { x = clamp(x); return x * x * x; };
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const sec = s => s / BT;
const PI = Math.PI;
let NOW = 0;                                        // 현재 시각(초) — 연속 동작용

// 비트 반응: 마지막 킥/스네어/임팩트 이후 경과시간으로 감쇠
function since(arr, t) { let last = -99; for (const x of arr) { if (x <= t + 1e-4) last = x; else break; } return t - last; }
function lastIdx(arr, t) { let k = -1; for (let i = 0; i < arr.length; i++) { if (arr[i] <= t + 1e-4) k = i; else break; } return k; }
const kickE = t => Math.exp(-since(BM.kicks, t) / 0.12);
const snE = t => Math.exp(-since(BM.snares, t) / 0.09);
const impE = t => Math.exp(-since(BM.impacts, t) / 0.25);

// 배경 모드별 색 (white = 반전 화면)
let TH;
function theme(mode) {
  const inv = mode === 'white', bg = inv ? WH : BK, fg = inv ? BK : WH;
  return { inv, bg, ink: fg, sub: mix(bg, fg, .45), panel: mix(bg, fg, .06), panel2: mix(bg, fg, .1), line: mix(bg, fg, .2),
           track: mix(bg, fg, .14), dim: mix(bg, fg, .3), hotBg: mix(bg, PU, .16) };
}
TH = theme('black');

// ================= 그리기 도구 =================
function tw(s, size, face = D, ls = 0) {
  ctx.save(); ctx.font = `${size}px ${face}`; ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
const fit = (s, size, face, maxW, ls = 0) => Math.min(size, size * maxW / Math.max(1, tw(s, size, face, ls)));
function T(s, x, y, size, col, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0 || s === undefined || s === null || s === '') return;
  s = String(s);
  ctx.save();
  ctx.font = `${size}px ${o.face || D}`;
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha *= a;
  if (o.blur > .3) ctx.filter = `blur(${o.blur}px)`;
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  const sc = o.sc ?? 1;
  ctx.scale(sc * (o.sx ?? 1), sc * (o.sy ?? 1));
  if (o.reveal !== undefined) {                     // 마스크 안에서 아래→위로 올라오는 글자
    const r = clamp(o.reveal);
    if (r <= 0) { ctx.restore(); return; }
    const w = ctx.measureText(s).width;
    const ax = o.align === 'left' ? 0 : o.align === 'right' ? -w : -w / 2;
    ctx.beginPath(); ctx.rect(ax - 30, -size * .66, w + 60, size * 1.32); ctx.clip();
    ctx.translate(0, (1 - eoE(r)) * size * 1.25);
  }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  if (o.stroke) { ctx.lineWidth = o.lw || 4; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.strokeText(s, 0, 0); }
  else { ctx.fillStyle = col; ctx.fillText(s, 0, 0); }
  ctx.restore();
}
function R(x, y, w, h, col, o = {}) {
  if ((o.alpha ?? 1) <= 0 || w <= 0 && !o.lw) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.beginPath();
  if (o.r) ctx.roundRect(x, y, w, h, Math.min(o.r, Math.abs(w) / 2, Math.abs(h) / 2)); else ctx.rect(x, y, w, h);
  if (o.lw) { ctx.lineWidth = o.lw; ctx.strokeStyle = col; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
  else { ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
function C(x, y, r, col, o = {}) {
  if ((o.alpha ?? 1) <= 0 || r <= 0) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.beginPath(); ctx.arc(x, y, r, o.a0 ?? 0, o.a1 ?? PI * 2);
  if (o.lw) { ctx.lineWidth = o.lw; ctx.strokeStyle = col; ctx.lineCap = o.cap || 'round'; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
  else { ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
function P(cx, cy, r, n, rot, col, o = {}) {        // 정다각형
  if ((o.alpha ?? 1) <= 0 || r <= 0) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = rot + i * 2 * PI / n - PI / 2; ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); }
  ctx.closePath();
  if (o.lw) { ctx.lineWidth = o.lw; ctx.lineJoin = 'miter'; ctx.strokeStyle = col; ctx.stroke(); }
  else { ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
function L(pts, col, lw, p = 1, o = {}) {           // 꺾은선을 p(0~1)만큼만 그림 → 끝점 반환
  if (p <= 0 || (o.alpha ?? 1) <= 0 || pts.length < 2) return null;
  let tot = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let rem = clamp(p) * tot, end = pts[0], dir = [1, 0];
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 20; }
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = o.cap || 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const k = Math.min(1, rem / (seg[i - 1] || 1));
    end = [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)];
    dir = [pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]];
    ctx.lineTo(...end); rem -= seg[i - 1];
  }
  ctx.stroke(); ctx.restore();
  return { end, dir };
}
function group(o, fn) {                             // 이동·크기·회전·투명도를 묶어서 적용
  if ((o.alpha ?? 1) <= 0) return;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(o.x || 0, o.y || 0);
  if (o.cx !== undefined) { ctx.translate(o.cx, o.cy); if (o.rot) ctx.rotate(o.rot); ctx.scale(o.sc ?? 1, o.sy ?? o.sc ?? 1); ctx.translate(-o.cx, -o.cy); }
  fn(); ctx.restore();
}
function img(k, x, y, w, o = {}) {                  // 이미지 (가로폭 기준, 가운데 정렬)
  const im = IMG[k];
  if (!im || !im.naturalWidth || (o.alpha ?? 1) <= 0) return null;
  const h = w * im.naturalHeight / im.naturalWidth;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
  ctx.restore();
  return { x0: x - w / 2, y0: y - h / 2, w, h };
}
function pill(s, x, y, size, bg, fg, o = {}) {      // 알약 모양 태그 → 폭 반환
  const face = o.face || S, w = tw(s, size, face, o.ls || 0) + size * 1.2, h = size * 1.7;
  const sc = o.sc ?? 1;
  if (sc <= 0) return w;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1; ctx.translate(x, y); ctx.scale(sc, sc);
  const ax = o.align === 'center' ? -w / 2 : o.align === 'right' ? -w : 0;
  R(ax, -h / 2, w, h, bg, { r: h / 2, glow: o.glow });
  if (o.outline) R(ax, -h / 2, w, h, fg, { r: h / 2, lw: 3 });
  T(s, ax + w / 2, 2, size, fg, { face, ls: o.ls || 0 });
  ctx.restore();
  return w;
}
function chars(s, size, face, ls) {                 // 최종 배치 기준 글자별 x (가운데 정렬)
  const full = tw(s, size, face, ls); let x = -full / 2;
  return Array.from(s).map(c => { const w = tw(c, size, face, ls); const o = { c, x: x + w / 2, w }; x += w; return o; });
}
const alignX = (x, w, align) => align === 'left' ? x : align === 'right' ? x - w : x - w / 2;   // 정렬 → 왼쪽 끝

// 연산: l 꺾은선 · g 닫힌 다각형 · r 사각형(x,y,w,h,둥글기) · c 원 · a 호(cx,cy,r,시작°,끝°) · e 타원(cx,cy,rx,ry,회전°)

  if (it.exit && it.until !== undefined && b > it.until - .25) {   // exit: 'fade' | 'drop' — until 직전 0.25박 동안 퇴장
    const q = clamp((b - it.until + .25) / .25);
    group({ alpha: 1 - q, y: it.exit === 'drop' ? q * 60 : 0, cx: Q.x, cy: Q.y, sc: it.exit === 'zoom' ? 1 + q * .4 : 1 }, () => fn(it, f, Q));
  } else fn(it, f, Q);
}
// 장면 머리글: [태그 알약] + 제목(쾅) + 부제(마스크 상승). 레퍼런스의 모든 정보 장면이 가진 공통 골격
function drawHead(h, b) {
  if (!h || !h.text) return;
  const right = h.align === 'right', x0 = right ? 1780 : 140, y = h.y ?? 150;
  let x = x0;
  const size = h.size || (h.tag ? 72 : 96), col = colorOf(h.color, TH.ink);
  if (h.tag && !right) { x += pill(h.tag, x, y, 40, PU, BK, { sc: eoB(b / .3) }) + 26; }
  slam(h.text, x, y + 2, size, col, b - (h.tag ? .2 : 0), { align: right ? 'right' : 'left', from: h.tag ? 1.6 : 2.2, glow: glowOf(col) });
  if (h.sub) {
    if (right) T(h.sub, x0, y + 80, 34, TH.sub, { face: S, align: 'right', reveal: (b - .3) / .4 });
    else T(h.sub, x + tw(h.text, size, D) + 34, y + 6, 40, PU, { face: S, align: 'left', reveal: (b - .3) / .4 });
  }
}
function fromJSON(list) {
  return list.map((s, i) => ({ ...s, label: s.label ?? (s.title ? `${String(i).padStart(2, '0')} ${s.title}` : ''),
    draw: s.draw ? window[s.draw] : (b, t, ink) => { drawHead(s.head, b); (s.items || []).forEach(it => item(it, b, ink)); } }));
}

// ================= 데모 장면 (scenes.js가 없을 때) =================
const SC = window.SCENES ? fromJSON(window.SCENES) : fromJSON([
  { from: 0, to: 4, title: 'HOOK', items: [{ fn: 'stack', x: 140, y: 560, size: 190, lines: [['센서값이'], ['구글 시트로', 'pu'], ['날아간다']], fly: 2 },
    { fn: 'icon', name: 'sensor', x: 1580, y: 420, size: 280, style: 'plain', at: .2 }] },
  { from: 4, to: 10, title: '역할 분담', head: { text: '역할 분담', sub: '4단계 릴레이' }, items: [
    { fn: 'flow', y: 480, nodes: [{ icon: 'sensor', label: 'DHT11', sub: '온습도 측정' }, { icon: 'board', label: 'UNO R4', sub: 'Wi-Fi 전송' }, { icon: 'cloud', label: 'Apps Script', sub: '받아서 검사' }, { icon: 'database', label: 'Sheet', sub: '한 줄 기록' }], packet: { text: '25·60' } }] },
]);

// ================= 배경 · 전환 · 후처리 =================
function bgAt(sc, b) {
  if (!sc.bg) return 'black';
  if (typeof sc.bg === 'string') return sc.bg;
  let m = sc.bg[0][1];
  for (const [at, mode] of sc.bg) if (b >= at) m = mode;
  return m;
}
const dotsL = document.createElement('canvas'), dotsD = document.createElement('canvas'), vig = document.createElement('canvas'), grains = [];
(function prep() {
  [[dotsL, '#ffffff'], [dotsD, '#000000']].forEach(([c, col]) => {
    c.width = W; c.height = H; const x = c.getContext('2d'); x.fillStyle = col;
    for (let y = 30; y < H; y += 60) for (let xx = 30; xx < W; xx += 60) { x.beginPath(); x.arc(xx, y, 1.6, 0, 7); x.fill(); }
  });
  vig.width = W; vig.height = H;
  const vx = vig.getContext('2d'), gr = vx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.75)');
  vx.fillStyle = gr; vx.fillRect(0, 0, W, H);
  let seed = 1; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // 렌더마다 같은 그레인
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 640; g.height = 360;
    const gx = g.getContext('2d'), im = gx.createImageData(640, 360);
    for (let i = 0; i < im.data.length; i += 4) { const v = rand() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    gx.putImageData(im, 0, 0); grains.push(g);
  }
})();
function bg(mode, t) {
  ctx.fillStyle = mode === 'white' ? WH : BK; ctx.fillRect(0, 0, W, H);
  if (mode === 'glow') {                             // 아래쪽 강조색 방사형 글로우 (킥에 맞춰 숨쉬기)
    const g = ctx.createRadialGradient(W / 2, H * 1.05, 0, W / 2, H * 1.05, H * (.85 + .05 * kickE(t)));
    g.addColorStop(0, rgba(PU, .55)); g.addColorStop(1, rgba(PU, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (FX.dots) { ctx.globalAlpha = .07 + .08 * kickE(t); ctx.drawImage(mode === 'white' ? dotsD : dotsL, 0, 0); ctx.globalAlpha = 1; }
}
// 장면 경계 전환: 0.34초(레퍼런스 측정 338ms) 동안 화면을 덮었다 걷음 — 컷이 그 아래에서 일어남
const WIPE_KINDS = ['slash', 'curtain', 'shutter'];
const WIPES = [];
SC.forEach((s, i) => { if (i === 0 || s.transition === 'none' || !FX.wipe) return; WIPES.push([s.from * BT, s.transition || WIPE_KINDS[(i - 1) % 3]]); });
function wipe(t) {
  for (const [t0, kind] of WIPES) {
    const p = (t - t0) / .34 + .5;
    if (p <= 0 || p >= 1) continue;
    const a = p < .5 ? eio(p * 2) : 1 - eio((p - .5) * 2);
    if (kind === 'curtain') { if (p < .5) R(0, 0, W * a, H, PU); else R(W * (1 - a), 0, W * a, H, PU); }
    else if (kind === 'shutter') { for (let i = 0; i < 8; i++) R(i * W / 8, 0, W / 8 + 1, H * clamp(a * 1.4 - i * .05), i % 2 ? WH : PU); }
    else if (kind === 'iris') { C(W / 2, H / 2, 1200 * a, PU); C(W / 2, H / 2, 1200 * a * .82, BK, { alpha: p < .5 ? 0 : 1 }); }
    else if (kind === 'split') { R(0, 0, W, H / 2 * a, PU); R(0, H - H / 2 * a, W, H / 2 * a, WH); }
    else if (kind === 'flash') { ctx.fillStyle = WH; ctx.globalAlpha = a; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    else {                                           // slash: 사선 슬래시
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-.35);
      R(-1400, -800, 2800, 1600 * a, PU); R(-1400, 800 - 800 * a, 2800, 800 * a, BK);
      ctx.restore();
    }
  }
}
function glitch(seed, amt) {                        // 가로 띠를 밀어 찢는 디지털 글리치
  for (let i = 0; i < 9; i++) {
    const y = rnd(seed + i) * H, h = 8 + rnd(seed + i + 9) * 90, dx = (rnd(seed + i + 20) - .5) * amt * 2;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
}
function hud(t, label, a) {                         // 모서리 브래킷 · 제목 · REC · 장면 라벨 · 타임코드 · 진행바
  if (a <= 0 || !FX.hud) return;
  ctx.save(); ctx.globalAlpha = a;
  const m = 44, c = 34;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) =>
    L([[x, y + sy * c], [x, y], [x + sx * c, y]], TH.sub, 3, 1, { cap: 'square' }));
  const top = typeof FX.hud === 'string' ? FX.hud : TITLE;
  if (top) T(top, 96, 62, 20, TH.sub, { face: S, align: 'left', ls: 2 });
  const rec = `BPM ${Math.round(BM.bpm)}  ·  REC`;
  C(W - 96 - tw(rec, 20, S, 2) - 20, 62, 7, PU, { alpha: .4 + .6 * kickE(t), glow: PU, gb: 12 });
  T(rec, W - 96, 63, 20, TH.sub, { face: S, align: 'right', ls: 2 });
  if (label) { R(96, H - 70, 14, 14, PU); T(label, 122, H - 62, 22, TH.ink, { face: S, align: 'left', ls: 2 }); }
  T(`${t.toFixed(2).padStart(5, '0')}s / ${Math.round(DUR)}s`, W - 96, H - 62, 20, TH.sub, { face: MONO, align: 'right' });
  R(0, H - 6, W * t / DUR, 6, PU, { glow: PU, gb: 10 });
  ctx.restore();
}

// ================= 엔딩 =================
function outroDraw(t) {
  const gb = (IMP - OS) / BT, b = (t - OS) / BT;
  if (b < gb) {                                      // 2박 정적: 선들이 중심으로 빨려 들어감
    const g = clamp(b / gb);
    for (let i = 0; i < 40; i++) {
      const a = rnd(i) * PI * 2, r0 = lerp(950, 40, eiC(clamp(g + rnd(i + 3) * .15))), len = 80 + rnd(i + 7) * 200;
      L([[W / 2 + Math.cos(a) * r0, 540 + Math.sin(a) * r0], [W / 2 + Math.cos(a) * (r0 + len), 540 + Math.sin(a) * (r0 + len)]], i % 4 ? PU : WH, 3, 1, { alpha: g });
    }
    C(W / 2, 540, 6 + 26 * eiC(g), WH, { glow: PU, gb: 50 });
    return;
  }
  const f = (t - IMP) / BT, fin = (t - FIN) / BT;
  group({ alpha: 1 - clamp((fin - .35) / .6) }, () => {
    P(W / 2, 540, 620 + 30 * kickE(t), 3, t * .15, PU, { lw: 3, alpha: .25 });
    P(W / 2, 540, 480, 4, -t * .2, WH, { lw: 2, alpha: .12 });
    burst(W / 2, 540, f, 77, 34, 1000);
    rings(W / 2, 540, f, WH, 1200);
    if (fin > 0) { burst(W / 2, 540, fin, 133, 40, 1400); rings(W / 2, 540, fin, PU, 1400); }
    const pump = 1 + .035 * kickE(t) + (fin > 0 ? .12 * Math.exp(-fin * 3) : 0);
    group({ cx: W / 2, cy: 540, sc: pump }, () => {
      if (OUTRO_TOP) slam(OUTRO_TOP, W / 2, 370, 96, WH, f, { face: S, ls: 34, from: 3 });
      const word = OUTRO_WORD, size = Math.min(290, 290 * 1700 / tw(word, 290, D, 6)), full = tw(word, size, D, 6);
      const cs = chars(word, size, D, 6), step = Math.min(.25, 2.25 / cs.length), wy = OUTRO_TOP ? 590 : 540;
      cs.forEach((k, i) => {
        const g = f - .25 - i * step;
        if (g >= 0) T(k.c, W / 2 + k.x, wy - (1 - eoB(g / .3)) * 260, size, PU,
          { ls: 6, sy: lerp(1.4, 1, eoE(g / .4)), alpha: clamp(g / .05), glow: PU, gb: 30 + 40 * kickE(t) + (fin > 0 ? 80 * Math.exp(-fin * 2) : 0) });
      });
      R(W / 2 - full / 2, wy + 170, full * eoE((f - 2.6) / .5), 12, WH);
      if (OUTRO_SUB) T(OUTRO_SUB, W / 2, wy + 240, 34, GR, { face: S, ls: 6, reveal: (f - 3) / .4 });
    });
  });
}

// ================= 메인 렌더 =================
function render(t) {
  NOW = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  const bt = t / BT, outro = t >= OS;
  let sc = null, lb = 0, mode = 'black';
  if (!outro) { sc = SC.find(s => bt < s.to) || SC[SC.length - 1]; lb = bt - sc.from; mode = bgAt(sc, lb); }
  TH = theme(mode);
  bg(mode, t);
  // 카메라: 스네어 흔들림(7px) + 임팩트 강타(28px) + 킥 줌 1.2% + 임팩트 줌 4% (+ 선택: 장면 컷 줌 펀치)
  const si = lastIdx(BM.snares, t), shake = FX.shake * (7 * snE(t) * (sc && sc.calm ? 0 : 1) + 28 * impE(t));
  const zx = (rnd(si * 3.1) - .5) * shake, zy = (rnd(si * 7.7) - .5) * shake;
  const z = 1 + FX.zoom * (.012 * kickE(t) + .04 * impE(t)) + (sc ? FX.punch * Math.exp(-lb * BT / .08) : 0);
  ctx.save();
  ctx.translate(W / 2 + zx, H / 2 + zy); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  if (outro) outroDraw(t); else sc.draw(lb, t, TH.ink);
  ctx.restore();
  wipe(t);
  // 플래시: 첫 프레임 드롭 + 임팩트
  if (FX.flash) {
    let fl = .85 * Math.exp(-t / .12);
    for (const x of BM.impacts) if (t >= x) fl = Math.max(fl, Math.exp(-(t - x) / .16));
    if (fl > .01) { ctx.fillStyle = WH; ctx.globalAlpha = fl; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }
  // 글리치: 임팩트 + (glitch 장면·엔딩) 스네어 직후 0.1초 · 엔딩 스트로브
  if (FX.glitch) {
    const sinceSn = since(BM.snares, t);
    if (sinceSn < .1 && (outro || (sc && sc.glitch))) glitch(si * 13, 40 * (1 - sinceSn / .1));
    if (impE(t) > .2) glitch(lastIdx(BM.impacts, t) * 31 + Math.floor(t * 30), 90 * impE(t));
    if (FX.strobe && outro && t < FIN && t >= IMP && sinceSn < .05) {
      ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = WH; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (FX.vignette) { ctx.globalAlpha = TH.inv ? .3 : 1; ctx.drawImage(vig, 0, 0); ctx.globalAlpha = 1; }   // 흰 화면은 약하게
  if (FX.grain) { ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(grains[Math.floor(t * 30) % 6], 0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
  hud(t, sc ? sc.label : '', clamp((t - .3) / .4) * (1 - clamp((t - OS) / .2)));
}

// ================= 미리보기 재생 =================
window.fontsReady = Promise.all([...['KRD', 'KRS', 'PL5', 'PL6', 'PL7', 'PL8', 'PL9'].map(f => document.fonts.load(`100px ${f}`).catch(() => {})), imgReady]);
const au = document.getElementById('au'), hint = document.getElementById('hint');
const q0 = parseFloat(new URLSearchParams(location.search).get('t') || '0');
fontsReady.then(() => render(q0));
au.addEventListener('loadedmetadata', () => { au.currentTime = q0; });
// 간이 서버는 구간 요청을 지원하지 않아 탐색이 안 됨 → 음원을 메모리에 받아서 재생
fetch(au.src).then(r => r.blob()).then(b => { au.src = URL.createObjectURL(b); }).catch(() => {});
cv.onclick = () => { if (au.paused) { au.play(); hint.style.display = 'none'; } else au.pause(); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') au.currentTime = Math.min(DUR, au.currentTime + 5);
  if (e.key === 'ArrowLeft') au.currentTime = Math.max(0, au.currentTime - 5);
  if (e.key === ' ') cv.onclick();
});
(function loop() { if (!au.paused) render(au.currentTime); requestAnimationFrame(loop); })();
</script>
